name: EAS Build

# Two ways in:
#   • workflow_dispatch — pick a platform + profile from the Actions "Run workflow"
#     button (ad-hoc development/preview/production builds).
#   • push of a v*.*.* tag — the house "cut a tag = ship prod" convention: builds
#     production for both platforms (see the agents KB `cicd` skill).
#
# Every build runs `--no-wait`: EAS queues the build on its own servers and the
# Actions job returns immediately, so we don't burn CI minutes waiting. Track
# progress on https://expo.dev.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform(s) to build
        type: choice
        options:
          - all
          - ios
          - android
        default: all
      profile:
        description: EAS build profile (from eas.json)
        type: choice
        options:
          - development
          - preview
          - production
        default: preview
  push:
    tags:
      - "v*.*.*"

# One in-flight build per ref; don't cancel a running build if another push lands.
concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate every build on the same checks as ci.yml — steps mirror ci.yml exactly.
  test:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        env:
          # @janne6565/rekordo-shared is on GitHub Packages, which authenticates
          # reads even for a public package.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  build:
    name: EAS build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # Fail early with an actionable message if the Expo token is missing.
      # expo/expo-github-action also errors on a missing token, but this points
      # straight at how to fix it.
      - name: Guard — EXPO_TOKEN must be set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Create an access token at https://expo.dev/accounts/janne6565/settings/access-tokens then run: gh secret set EXPO_TOKEN -R Janne6565/rekordo-mobile"
            exit 1
          fi

      # Resolve what to build: tag push → production/all; manual run → the inputs.
      # A tag ships production; which platforms it ships is the EAS_RELEASE_PLATFORMS
      # repo variable, defaulting to iOS.
      #
      # It used to be hardcoded to "all", which was aspirational rather than true: no
      # Android build has ever succeeded, there is no Play Console record to submit to,
      # and `--platform all --non-interactive` fails as one command — so the platform
      # that *is* ready never reached the queue. Android joins by flipping the variable
      # once its keystore and service account exist:
      #   gh variable set EAS_RELEASE_PLATFORMS --body all -R Janne6565/rekordo-mobile
      - name: Resolve build parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "platform=${{ vars.EAS_RELEASE_PLATFORMS || 'ios' }}" >> "$GITHUB_OUTPUT"
            echo "profile=production" >> "$GITHUB_OUTPUT"
          else
            echo "platform=${{ inputs.platform }}" >> "$GITHUB_OUTPUT"
            echo "profile=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # This install is only what eas-cli needs locally to read the project. The
      # install that matters for the artifact happens on the EAS worker, which
      # reads NODE_AUTH_TOKEN from the EAS environment (see docs/RELEASING.md) —
      # secrets.GITHUB_TOKEN is scoped to this workflow run and cannot reach it.
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: bun

      # Default path: dispatch runs, and tag pushes when auto-submit is NOT enabled.
      # --no-wait: EAS builds on its servers; this job doesn't block.
      - name: EAS build
        if: "!(github.event_name == 'push' && vars.EAS_AUTO_SUBMIT == 'true')"
        # EAS must not manage this app's Apple capabilities.
        #
        # It derives the desired set from the Expo config, which declares no native Apple
        # auth module — so it asks Apple to turn Sign in with Apple *off*. The app does
        # offer it, through a browser flow the backend completes against a Services ID
        # hanging off this bundle, and Apple refuses to remove a capability something is
        # still attached to. The whole patch is rejected with it, push included.
        env:
          EXPO_NO_CAPABILITY_SYNC: "1"
        run: eas build --platform ${{ steps.params.outputs.platform }} --profile ${{ steps.params.outputs.profile }} --non-interactive --no-wait

      # Tag pushes only, and only when the EAS_AUTO_SUBMIT repo variable is "true".
      # Kept as a separate, opt-in step because submit.production in eas.json ships
      # without an ascAppId — until the store records exist, a tag must still build
      # without failing on a submit. Enable with:
      #   gh variable set EAS_AUTO_SUBMIT --body true -R Janne6565/rekordo-mobile
      # --auto-submit queues the store submission on EAS after the build finishes,
      # so it composes with --no-wait (the submit happens server-side).
      - name: EAS build + auto-submit
        if: github.event_name == 'push' && vars.EAS_AUTO_SUBMIT == 'true'
        # EAS must not manage this app's Apple capabilities.
        #
        # It derives the desired set from the Expo config, which declares no native Apple
        # auth module — so it asks Apple to turn Sign in with Apple *off*. The app does
        # offer it, through a browser flow the backend completes against a Services ID
        # hanging off this bundle, and Apple refuses to remove a capability something is
        # still attached to. The whole patch is rejected with it, push included.
        env:
          EXPO_NO_CAPABILITY_SYNC: "1"
        run: eas build --platform ${{ steps.params.outputs.platform }} --profile production --non-interactive --no-wait --auto-submit
